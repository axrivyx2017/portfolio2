<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>portfolio</title>

<style>
:root{
  --bg:#020617;
  --card:rgba(17,26,51,0.6);
  --accent:#3b82f6;
  --text:#e0e7ff;
  --sub:#94a3b8;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
  scroll-behavior:smooth;
}

/* premium text selection */
::selection{
  background:rgba(59,130,246,0.25);
  color:#e0e7ff;
}

body{
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  overflow-x:hidden;
}

/* glow */
body::before,body::after{
  content:"";
  position:fixed;
  width:600px;
  height:600px;
  filter:blur(120px);
  z-index:-1;
}

body::before{
  background:radial-gradient(circle,rgba(59,130,246,0.4),transparent);
  top:10%;left:10%;
  animation:move1 12s infinite alternate;
}

body::after{
  background:radial-gradient(circle,rgba(37,99,235,0.4),transparent);
  bottom:10%;right:10%;
  animation:move2 14s infinite alternate;
}

@keyframes move1{
  100%{transform:translate(120px,80px);}
}
@keyframes move2{
  100%{transform:translate(-120px,-60px);}
}

/* layout */
.container{
  max-width:900px;
  padding:40px 20px;
  text-align:center;
}

h1{
  color:var(--accent);
  text-shadow:0 0 20px rgba(59,130,246,0.7);
}

/* nav */
nav a{
  margin:0 10px;
  color:var(--sub);
  text-decoration:none;
  position:relative;
}
nav a::after{
  content:"";
  position:absolute;
  width:0%;
  height:2px;
  background:var(--accent);
  left:0;
  bottom:-4px;
  transition:.3s;
}
nav a:hover::after{
  width:100%;
}

/* cards */
.card{
  background:var(--card);
  backdrop-filter:blur(12px);
  padding:25px;
  margin:20px 0;
  border-radius:20px;

  opacity:0;
  transform:translateY(60px) scale(0.95);
  filter:blur(10px);

  transition:
    opacity 0.8s ease,
    transform 0.8s cubic-bezier(.22,1,.36,1),
    filter 0.8s ease;
}

.card.show{
  opacity:1;
  transform:translateY(0) scale(1);
  filter:blur(0);
}

.card:hover{
  transform:translateY(-10px) scale(1.03);
  box-shadow:0 0 60px rgba(59,130,246,0.3);
}

/* PLAYER */
.player{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.cover{
  width:120px;
  height:120px;
  border-radius:20px;
  margin-bottom:15px;
  box-shadow:0 0 25px rgba(59,130,246,0.4);
  transition:.4s;
}

.player.playing .cover{
  transform:scale(1.05) rotate(2deg);
}

.controls button{
  background:var(--accent);
  border:none;
  color:#fff;
  font-size:20px;
  padding:10px 20px;
  border-radius:10px;
  cursor:pointer;
}

.progress{
  width:100%;
  height:6px;
  background:rgba(255,255,255,0.1);
  border-radius:10px;
  margin-top:15px;
  overflow:hidden;
  cursor:pointer;
}

.progress-bar{
  height:100%;
  width:0%;
  background:var(--accent);
}

.time{
  width:100%;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--sub);
  margin-top:5px;
}

/* buttons */
.buttons a{
  display:inline-block;
  margin:10px;
  padding:10px 20px;
  border-radius:10px;
  background:var(--accent);
  color:white;
  text-decoration:none;
}

/* PREMIUM UI */
.premium-glow{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:
    radial-gradient(circle at 20% 20%, rgba(59,130,246,0.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(37,99,235,0.06), transparent 45%);
  mix-blend-mode:screen;
}

.premium-hint{
  position:fixed;
  bottom:20px;
  right:20px;
  background:rgba(17,26,51,0.7);
  border:1px solid rgba(59,130,246,0.3);
  color:var(--sub);
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
  backdrop-filter:blur(10px);
  opacity:0;
  transform:translateY(10px);
  transition:.4s;
}

.premium-hint.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>

<div class="premium-glow"></div>
<div class="premium-hint" id="hint">premium mode active</div>

<div class="container">

<h1>♰Mudzaichik♰</h1>

<nav>
<a href="#about">about</a>
<a href="#skills">skills</a>
<a href="#contact">contact</a>
</nav>

<!-- PLAYER -->
<div class="card player">
  <img src="cover.jpg" class="cover">

  <h2>Вова и леха</h2>
  <p>Сметана band</p>

  <div class="controls">
    <button id="playBtn">▶</button>
  </div>

  <div class="progress" id="progressContainer">
    <div class="progress-bar" id="progress"></div>
  </div>

  <div class="time">
    <span id="current">0:00</span>
    <span id="duration">0:00</span>
  </div>
</div>

<div class="card" id="about">
<h2>about me</h2>
<p>gamer • music lover • loyal friend • development-oriented</p>
</div>

<div class="card" id="skills">
<h2>skills</h2>
<p>gaming • online games experience  
music listening & vibe control  
</p>
</div>

<div class="card" id="contact">
<h2>contact</h2>
<div class="buttons">
<a href="https://t.me/lazdum">telegram</a>
<a href="https://tiktok.com/@mudzaichik">tiktok</a>
</div>
</div>

</div>

<audio id="audio" src="music.mp3"></audio>

<script>
const audio = document.getElementById("audio")
const playBtn = document.getElementById("playBtn")
const progress = document.getElementById("progress")
const progressContainer = document.getElementById("progressContainer")
const currentEl = document.getElementById("current")
const durationEl = document.getElementById("duration")
const player = document.querySelector(".player")

let isPlaying = false

const MAX_VOLUME = 0.5
audio.volume = 0
audio.muted = true

// autoplay
window.addEventListener("load", () => {
  audio.play().then(()=>{
    playBtn.textContent = "⏸"
    player.classList.add("playing")
    isPlaying = true
  }).catch(()=>{})
})

// unlock sound
document.addEventListener("click", function enableSound(){
  audio.muted = false

  let v = 0
  const fade = setInterval(()=>{
    if(v < MAX_VOLUME){
      v += 0.02
      audio.volume = v
    }else{
      audio.volume = MAX_VOLUME
      clearInterval(fade)
    }
  },50)

  document.removeEventListener("click", enableSound)
})

// play pause
playBtn.onclick = () => {
  if(isPlaying){
    audio.pause()
    playBtn.textContent = "▶"
    player.classList.remove("playing")
  }else{
    audio.play()
    playBtn.textContent = "⏸"
    player.classList.add("playing")
  }
  isPlaying = !isPlaying
}

// time
function formatTime(t){
  const m = Math.floor(t/60)
  const s = Math.floor(t%60)
  return `${m}:${s<10?"0"+s:s}`
}

audio.addEventListener("loadedmetadata", ()=>{
  durationEl.textContent = formatTime(audio.duration)
})

audio.addEventListener("timeupdate", ()=>{
  currentEl.textContent = formatTime(audio.currentTime)
  progress.style.width = (audio.currentTime/audio.duration)*100 + "%"
})

progressContainer.addEventListener("click",(e)=>{
  const w = progressContainer.clientWidth
  audio.currentTime = (e.offsetX/w)*audio.duration
})

// premium UX
document.addEventListener("dragstart", e => e.preventDefault())

document.addEventListener("contextmenu", (e)=>{
  hint.classList.add("show")
  setTimeout(()=>hint.classList.remove("show"),2000)
})

// animation
const cards = document.querySelectorAll(".card")

const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting) e.target.classList.add("show")
  })
},{threshold:0.2})

cards.forEach(c=>observer.observe(c))

// 🚫 disable copy / cut / paste
document.addEventListener("copy", (e) => {
  e.preventDefault()
  showHint("copy blocked")
})

document.addEventListener("cut", (e) => {
  e.preventDefault()
  showHint("cut blocked")
})

document.addEventListener("paste", (e) => {
  e.preventDefault()
  showHint("paste blocked")
})

// 🚫 disable text selection
document.addEventListener("selectstart", (e) => {
  e.preventDefault()
})

// 🚫 disable drag (text + images)
document.addEventListener("dragstart", (e) => {
  e.preventDefault()
})

// 💡 reuse your premium hint
const hint = document.getElementById("hint")

function showHint(text){
  if(!hint) return
  hint.textContent = text
  hint.classList.add("show")

  setTimeout(() => {
    hint.textContent = "premium mode active"
    hint.classList.remove("show")
  }, 1500)
}
</script>

</body>
</html>
