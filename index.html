<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ultra portfolio</title>

<style>
:root{
  --bg:#020617;
  --card:rgba(17,26,51,0.6);
  --accent:#3b82f6;
  --text:#e0e7ff;
  --sub:#94a3b8;
}

*{
  margin:0;padding:0;box-sizing:border-box;
  font-family:Arial;scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  overflow-x:hidden;
  user-select:none;
}

/* background glow */
body::before,body::after{
  content:"";
  position:fixed;
  width:600px;
  height:600px;
  filter:blur(120px);
  z-index:-1;
}

body::before{
  background:radial-gradient(circle,rgba(59,130,246,0.4),transparent);
  top:10%;left:10%;
  animation:move1 12s infinite alternate;
}

body::after{
  background:radial-gradient(circle,rgba(37,99,235,0.4),transparent);
  bottom:10%;right:10%;
  animation:move2 14s infinite alternate;
}

@keyframes move1{
  100%{transform:translate(120px,80px);}
}

@keyframes move2{
  100%{transform:translate(-120px,-60px);}
}

/* layout */
.container{
  max-width:900px;
  padding:40px 20px;
  text-align:center;
}

h1{
  color:var(--accent);
  text-shadow:0 0 20px rgba(59,130,246,0.7);
}

/* nav */
nav a{
  margin:0 10px;
  color:var(--sub);
  text-decoration:none;
  position:relative;
}

nav a.active{
  color:var(--accent);
  text-shadow:0 0 10px var(--accent);
}

nav a::after{
  content:"";
  position:absolute;
  width:0%;
  height:2px;
  background:var(--accent);
  left:0;
  bottom:-4px;
  transition:.3s;
}

nav a:hover::after,
nav a.active::after{
  width:100%;
}

/* cards */
.card{
  background:var(--card);
  backdrop-filter:blur(12px);
  padding:25px;
  margin:20px 0;
  border-radius:20px;

  opacity:0;
  transform:translateY(50px) scale(0.98);
  transition:.6s;
}

.card.show{
  opacity:1;
  transform:translateY(0) scale(1);
}

/* hover effect */
.card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 0 50px rgba(59,130,246,0.25);
}

/* buttons */
.buttons a{
  display:inline-block;
  margin:10px;
  padding:10px 20px;
  border-radius:10px;
  background:var(--accent);
  color:white;
  text-decoration:none;
  transition:.3s;
  position:relative;
  overflow:hidden;
}

.buttons a:hover{
  transform:translateY(-3px) scale(1.05);
  box-shadow:0 0 20px rgba(59,130,246,0.6);
}

.buttons a::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.15);
  top:0;
  left:-100%;
  transition:.4s;
}

.buttons a:hover::after{
  left:100%;
}

/* typing */
#typing::after{
  content:"|";
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}
</style>
</head>

<body>

<div class="container">

<h1>@nickname</h1>

<nav>
<a href="#about">about</a>
<a href="#skills">skills</a>
<a href="#contact">contact</a>
</nav>

<div class="card">
<h2>music playing</h2>
<p>background audio enabled</p>
</div>

<div class="card" id="about">
<h2>about</h2>
<p id="typing"></p>
</div>

<div class="card" id="skills">
<h2>skills</h2>
<p>html css js design</p>
</div>

<div class="card" id="contact">
<h2>contact</h2>
<div class="buttons">
<a href="https://t.me/USERNAME" target="_blank">telegram</a>
<a href="https://tiktok.com/@USERNAME" target="_blank">tiktok</a>
<a href="https://discord.com" target="_blank">discord</a>
</div>
</div>

</div>

<!-- hidden background music -->
<audio id="audio" src="music.mp3" autoplay loop></audio>

<script>

// 🔒 lock copy
document.addEventListener('copy',e=>e.preventDefault())
document.addEventListener('contextmenu',e=>e.preventDefault())

// 🎧 autoplay music (30%)
const audio=document.getElementById("audio")
audio.volume=0.3
audio.loop=true

window.addEventListener("load",()=>{
  audio.play().catch(()=>{})
})

// typing
const texts=["minimal developer.","clean ui designer.","learning & building."]
let i=0,j=0,current=""

function type(){
  if(i===texts.length)i=0
  current=texts[i]
  let text=current.slice(0,++j)
  document.getElementById("typing").textContent=text

  if(text.length===current.length){
    setTimeout(()=>erase(),1500)
  }else setTimeout(type,50)
}

function erase(){
  let text=current.slice(0,--j)
  document.getElementById("typing").textContent=text

  if(text.length===0){
    i++
    setTimeout(type,300)
  }else setTimeout(erase,30)
}
type()

// reveal
const cards=document.querySelectorAll(".card")
const obs=new IntersectionObserver(e=>{
  e.forEach(x=>{
    if(x.isIntersecting)x.target.classList.add("show")
  })
},{threshold:0.15})

cards.forEach(c=>obs.observe(c))

</script>

</body>
</html>
